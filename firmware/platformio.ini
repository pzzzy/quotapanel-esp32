[env:quotapanel-esp32]
platform = espressif32@7.1.3
platform_packages = platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
extra_scripts = pre:strip_paths.py
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.app_partition_name = ota_0
board_upload.offset_address = 0x240000
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    bblanchon/ArduinoJson@7.4.2
